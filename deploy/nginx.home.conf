server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 128k;
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
    set $backend backend:8000;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location / { try_files $uri $uri/ /index.html; }
    location /api/ {
        proxy_pass http://$backend;
        proxy_set_header Host $host;
    }
}
