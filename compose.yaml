services:
  backend:
    image: localhost/board-tracker-backend:1
    build: ./backend
    networks: [tracker]
    env_file: [.env, ./deploy/ldap.env]
    environment:
      APP_ENV: production
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - "${TRACKER_TRUST_DIR:-./deploy/trust}:/certs:ro,z"
      - "${TRACKER_BACKUP_STATUS_DIR:-./deploy/backup-status}:/backups:ro,z"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python -m tracker.diagnostics http"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    image: localhost/board-tracker-backend:1
    command: ["python", "-m", "tracker.worker"]
    networks: [tracker]
    env_file: [.env, ./deploy/smtp.env]
    environment:
      APP_ENV: production
    volumes:
      - "${TRACKER_TRUST_DIR:-./deploy/trust}:/certs:ro,z"
    restart: always

  web:
    image: localhost/board-tracker-web:1
    build:
      context: .
      dockerfile: frontend/Dockerfile
    networks: [tracker]
    depends_on: [backend]
    ports:
      - "${TRACKER_HTTP_PORT:-8080}:8080"
      - "${TRACKER_HTTPS_PORT:-8443}:8443"
    environment:
      PUBLIC_URL: "${PUBLIC_URL:-https://localhost:8443}"
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
      NGINX_ENVSUBST_FILTER: "^(PUBLIC_URL|NGINX_LOCAL_RESOLVERS)$"
    volumes:
      - "${TRACKER_TLS_DIR:-./deploy/tls}:/etc/nginx/tls:ro,Z"
    restart: always

networks:
  tracker:
    driver: bridge
